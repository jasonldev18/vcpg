[project]
name = "vcpg"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "keyring>=25",
  "anthropic>=1.12",
  "claude-agent-sdk>=0.2.165",
  "python-pptx>=1.0",
  "matplotlib>=3.9",
  "fastembed>=0.5",
  "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "httpx2", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[tool.setuptools]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "design", "calibration"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["backend", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: hits the real Claude API (opt-in via `make live`)",
  "network: needs the internet or local sockets; skipped inside the audit sandbox",
]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.mypy.overrides]]
module = ["backend.exports.pptx"]
disallow_untyped_calls = false  # python-pptx has no type hints
