[project]
name = "vcpg"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[tool.setuptools]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Claude API (opt-in via `make live`)"]
addopts = "-m 'not live'"
