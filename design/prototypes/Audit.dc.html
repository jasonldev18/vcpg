<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VCPG: audit bay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Silkscreen:wght@400;700&display=swap">
<style>
:root{--acc:#FF9B3D;--acc3:#FFD27A;--text:#F7EBDD;--mute:#BFA58F}
body{margin:0;background:#050302}
a{color:#FF9B3D}a:hover{color:#FFD27A}
.bay{font-family:'IBM Plex Sans',sans-serif;color:var(--text)}
.pix{font-family:'Silkscreen',monospace;letter-spacing:.04em}
.mono{font-family:'IBM Plex Mono',monospace}
.chip{min-height:44px;padding:0 14px;background:rgba(13,9,6,.7);border:1px solid rgba(255,155,61,.35);color:var(--mute);cursor:pointer;font:500 12px 'Oxanium',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.chip:hover{border-color:var(--acc);color:var(--text)}
.chip.on{color:#1A0E06;background:linear-gradient(90deg,#FF9B3D,#FFD27A);border-color:transparent}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;background:rgba(13,9,6,.7);border:1px solid #FF9B3D;color:#FF9B3D;font:600 12px 'Oxanium',sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;box-sizing:border-box}
.btn:hover{background:rgba(255,155,61,.18);color:#FF9B3D}
</style>
</helmet>
<div class="bay" style="position: relative; width: 100%; background: #050302; overflow: hidden">
<canvas ref="{{ setView }}" onMouseMove="{{ onCanvasMove }}" onMouseLeave="{{ onCanvasLeave }}" onClick="{{ onCanvasClick }}" role="img" aria-label="Pixel-art space mission control room. Four agents in black suits and sunglasses work at consoles, pin issues to a red intel board, repair them in a side bay, test them in a glass chamber, and pin cleared pull requests to a second board." style="display: block; width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; cursor: crosshair"></canvas>

<div style="position: absolute; left: 0; top: 0; right: 0; padding: 14px 20px 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; background: linear-gradient(rgba(5,3,2,.85), rgba(5,3,2,0)); pointer-events: none">
<span class="pix" style="font-size: 20px; font-weight: 700; color: #FFD27A">AUDIT BAY</span>
<span class="mono" style="font-size: 13px; color: {{ statusColor }}">{{ status }}</span>
<div style="flex: 1 1 0"></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; pointer-events: auto">
<sc-for list="{{ modes }}" as="m" hint-placeholder-count="3">
<button class="chip {{ m.cls }}" aria-pressed="{{ m.on }}" onClick="{{ m.pick }}">{{ m.label }}</button>
</sc-for>
<a class="btn" href="MissionControl.dc.html">Mission control</a>
</div>
</div>

<div style="position: absolute; left: 20px; bottom: 18px; max-width: 640px; padding: 10px 14px; background: rgba(5,3,2,.72); border: 1px solid rgba(255,155,61,.25); display: flex; flex-direction: column; gap: 3px; pointer-events: none">
<span class="pix" style="font-size: 12px; color: #FF9B3D">SHIP LOG</span>
<sc-for list="{{ log }}" as="l" hint-placeholder-count="3">
<div class="mono" style="font-size: 12px; color: {{ l.color }}">{{ l.text }}</div>
</sc-for>
</div>
<div class="mono" style="position: absolute; right: 20px; bottom: 18px; font-size: 12px; color: #BFA58F; background: rgba(5,3,2,.72); padding: 8px 12px; pointer-events: none">Hover an agent for their dossier. Click to poke.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"offline","options":["offline","quick","deep"]},"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
state = { mode: null, log: [], line: '' };

CREW = {
  lead: { name: 'ROOK', role: 'AUDIT LEAD', code: 'AGENT 001', tie: '#FF4D5E', tieD: '#B8303C', skin: '#E0B48F', skinD: '#C4936C', hair: '#C9CED6', hl: '#EEF0F4', home: 'seat_lead', coat: true },
  build: { name: 'BOLT', role: 'BUILD AUDITOR', code: 'AGENT 004', tie: '#5AA9FF', tieD: '#2F6FD0', skin: '#8D5A3B', skinD: '#6E4329', hair: '#2A1E16', hl: '#4A3A2E', home: 'seat_code' },
  teach: { name: 'ECHO', role: 'TEACHING AUDITOR', code: 'AGENT 007', tie: '#41D6C3', tieD: '#1E9C8C', skin: '#F1C7A3', skinD: '#D8A884', hair: '#1A1420', hl: '#3A2E48', home: 'seat_lessons', mic: true },
  out: { name: 'PIXEL', role: 'OUTPUT AUDITOR', code: 'AGENT 009', tie: '#FFD45E', tieD: '#D9A62A', skin: '#C68B5E', skinD: '#A56E45', hair: '#F2C25A', hl: '#FFE7A0', home: 'seat_slides', pocket: '#FFD45E' }
};
HUB = [0, 262];
LOC = {
  seat_code: { p: [-0.585, 252], via: [[-0.585, 262]], face: 'back', sit: true },
  seat_plans: { p: [-0.275, 252], via: [[-0.275, 262]], face: 'back', sit: true },
  seat_lessons: { p: [0.275, 252], via: [[0.275, 262]], face: 'back', sit: true },
  seat_inter: { p: [0.585, 252], via: [[0.585, 262]], face: 'back', sit: true },
  seat_slides: { p: [-0.42, 302], via: [[-0.42, 318], [0, 318]], face: 'back', sit: true },
  behind_slides: { p: [-0.42, 314], via: [[-0.42, 318], [0, 318]], face: 'back' },
  seat_lead: { p: [0, 357], via: [[0.28, 357], [0.28, 318], [0, 318]], face: 'back', sit: true },
  issue_a: { p: [-0.56, 216], via: [[0, 216]], face: 'back' }, issue_b: { p: [-0.44, 216], via: [[0, 216]], face: 'back' }, issue_c: { p: [-0.32, 216], via: [[0, 216]], face: 'back' },
  pr_a: { p: [0.32, 216], via: [[0, 216]], face: 'back' }, pr_b: { p: [0.44, 216], via: [[0, 216]], face: 'back' }, pr_c: { p: [0.56, 216], via: [[0, 216]], face: 'back' },
  bench_a: { p: [0.8, 232], via: [[0.8, 262]], face: 'right' }, bench_b: { p: [0.8, 244], via: [[0.8, 262]], face: 'right' }, bench_c: { p: [0.8, 256], via: [[0.8, 262]], face: 'right' },
  test_a: { p: [-0.8, 232], via: [[-0.8, 262]], face: 'left' }, test_b: { p: [-0.8, 244], via: [[-0.8, 262]], face: 'left' }, test_c: { p: [-0.8, 256], via: [[-0.8, 262]], face: 'left' }
};
DESKS = [
  { yF: 240, u0: -0.74, u1: -0.12, st: [['code', -0.74, -0.43, ['code', 'tree']], ['plans', -0.43, -0.12, ['gantt', 'list']]] },
  { yF: 240, u0: 0.12, u1: 0.74, st: [['lessons', 0.12, 0.43, ['quiz', 'bars']], ['interviews', 0.43, 0.74, ['wave', 'chat']]] },
  { yF: 290, u0: -0.64, u1: -0.2, st: [['slides', -0.64, -0.2, ['slide', 'thumbs', 'chart']]] },
  { yF: 290, u0: 0.2, u1: 0.64, st: [['comms', 0.2, 0.64, ['radar', 'map']]] },
  { yF: 345, u0: -0.2, u1: 0.2, st: [['holo', -0.2, 0.2, ['list', 'globe', 'map']]] },
  { yF: 345, u0: -1.0, u1: -0.45, st: [['decorL', -1.0, -0.45, ['chart', 'radar']]] },
  { yF: 345, u0: 0.45, u1: 1.0, st: [['decorR', 0.45, 1.0, ['map', 'bars']]] }
];
LABEL = { code: 'CODE', plans: 'PLANS', lessons: 'LESSONS', interviews: 'INTERVIEWS', slides: 'SLIDES', comms: 'COMMS', holo: 'COMMAND', decorL: 'NAV', decorR: 'SIGNALS' };
CHAIRS = [['seat_code', -0.585, 252], ['seat_plans', -0.275, 252], ['seat_lessons', 0.275, 252], ['seat_inter', 0.585, 252], ['seat_slides', -0.42, 302], ['seat_comms', 0.42, 302], ['seat_lead', 0, 357]];
ISSUES = {
  0: { id: 'I-12', tag: 'HINT LEAK', title: 'Interviewer gave away the answer in a hint', pr: '#41', prTag: 'HINT RULE', prTitle: 'Interviewer: hints never name the concept' },
  1: { id: 'I-13', tag: 'SLIDE VS CODE', title: 'Slide says full sort, code uses argpartition', pr: '#42', prTag: 'DIFF SLIDES', prTitle: 'Slide writer reads the final diff, not the plan' },
  2: { id: 'I-14', tag: 'REPLANS', title: 'Step 5 needed three replans', pr: '#43', prTag: 'SPLIT STEPS', prTitle: 'Planner splits steps over 200 lines' }
};
CHECKS = { reviewer: 'Reviewer cuts were safe', quizzes: 'Lesson quizzes are balanced', grader: 'Grader calibration 6 of 6' };

setView = (el) => { this.view = el; };

hw(y) { return 260 * (y - 60) / 140; }
X(u, y) { return 360 + u * this.hw(y); }
sc(y) { return this.hw(y) / 260; }
hs(n) { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); }
poly(g, pts, fill) { g.fillStyle = fill; g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); g.fill(); }
rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }
yt(x) { return 60 - 0.14615 * Math.abs(360 - x); }
yb(x) { return 60 + 0.53846 * Math.abs(360 - x); }

mode() { return this.state.mode || this.props.mode || 'offline'; }

scripts(mode) {
  const go = (k, run) => ({ type: 'go', to: k, run: run });
  const work = (secs, say, anim, at, fx) => ({ type: 'work', secs: secs, say: say, anim: anim || 'type', at: at, fx: fx });
  const ev = (e) => ({ type: 'ev', ev: e });
  const emo = (e, secs) => ({ type: 'emote', e: e, secs: secs });
  const carry = (c) => ({ type: 'carry', c: c });
  const rest = () => work(1e9, '', 'idle'), sleep = () => work(1e9, '', 'sleep');
  const fix = (k, iss, bench, test, pr, fixSay, testSay, extra) => [emo('!', 0.7), go(iss, true), work(1, 'PINNING INTEL', 'pin'), ev('pin:' + k), work(0.5, '', 'idle'),
    carry('issue'), ev('take:' + k), go(bench), carry(null), ev('fix:' + k), work(4.2, fixSay, 'hammer', 'bench', 'spark'), carry('pr'), go(test), carry(null),
    work(2.5, testSay, 'scan', 'test')].concat(extra || [], [carry('pr'), go(pr), work(0.8, '', 'pin'), carry(null), ev('pr:' + k), work(1.4, '', 'cheer')]);
  if (mode === 'offline') return { lead: [sleep()], build: [sleep()], teach: [sleep()], out: [sleep()] };
  if (mode === 'quick') {
    return { build: [sleep()], teach: [sleep()], out: [sleep()],
      lead: [work(1.3, '', 'stretch'), go('seat_inter'), work(2.4, 'CHECKING ANSWERS', 'type', 'interviews'), ev('pass:grader'), go('behind_slides'), work(2.8, 'CHECKING SLIDES', 'type', 'slides')]
        .concat(fix(1, 'issue_b', 'bench_b', 'test_b', 'pr_b', 'FIXING SLIDE WRITER', 'RUNNING TESTS'), [ev('ready'), go('seat_lead'), work(2.4, 'SCAN COMPLETE', 'idle'), ev('done'), rest()]) };
  }
  return {
    lead: [work(1.3, '', 'stretch'), work(5, 'COLLECTING REPORTS', 'type', 'holo'), { type: 'until', n: 3, say: 'TRACING CAUSES', anim: 'type', at: 'holo' },
      emo('!', 0.6), go('pr_b', true), work(1.8, 'STAMPING APPROVAL', 'pin'), ev('ready'), work(1.6, '', 'cheer'), go('seat_lead'), work(2.6, 'SCAN COMPLETE', 'idle'), ev('done'), rest()],
    build: [work(1.0, '', 'stretch'), work(3, 'CHECKING CODE', 'type', 'code'), ev('pass:reviewer'), emo('ok', 0.6), go('seat_plans'), work(3, 'CHECKING PLANS', 'type', 'plans')]
      .concat(fix(2, 'issue_a', 'bench_a', 'test_a', 'pr_a', 'FIXING PLANNER', 'RUNNING TESTS'), [go('seat_code'), rest()]),
    teach: [work(1.5, '', 'stretch'), work(3, 'CHECKING QUIZZES', 'type', 'lessons'), ev('pass:quizzes'), emo('ok', 0.6), go('seat_inter'), work(3.6, 'READING TRANSCRIPTS', 'type', 'interviews')]
      .concat(fix(0, 'issue_b', 'bench_b', 'test_b', 'pr_c', 'FIXING INTERVIEWER', 'RERUNNING CALIBRATION', [ev('pass:grader')]), [go('seat_lessons'), rest()]),
    out: [work(2.0, '', 'stretch'), work(4.2, 'CHECKING SLIDES', 'type', 'slides')]
      .concat(fix(1, 'issue_c', 'bench_c', 'test_c', 'pr_b', 'FIXING SLIDE WRITER', 'RECHECKING SLIDES'), [go('seat_slides'), rest()])
  };
}

reset(mode) {
  const sc = this.scripts(mode), ids = ['lead', 'build', 'teach', 'out'];
  const S = this.sim = { t: 0, mode: mode, alarmAt: -10, doneAt: null, readyAt: -10, shake: 0, parts: [], beams: [], log: [],
    issues: {}, prs: {}, issueOrder: [], prOrder: [], cardT: {}, prT: {},
    agents: ids.map((id, i) => { const L = this.LOC[this.CREW[id].home];
      return { id: id, u: L.p[0], y: L.p[1], loc: this.CREW[id].home, seated: true, walking: false, face: 'back', anim: 'sleep', say: '', prevSay: '', sayAt: 0,
        at: null, fx: null, carry: null, emote: null, poke: -10, off: i * 0.73, front: id === 'out' && mode !== 'deep', q: sc[id].slice(), cur: null }; }) };
  if (mode === 'offline') {
    S.issueOrder = ['0', '1', '2']; S.prOrder = ['0', '1', '2'];
    ['0', '1', '2'].forEach((k) => { S.issues[k] = 'fixed'; S.prs[k] = 'merged'; });
    S.log = [{ text: '> Last deep scan: 3 issues found, 3 pull requests merged', color: '#BFA58F' }, { text: '> All agents off duty. Next scan after the current project.', color: '#8FA2C4' }];
  }
  this.sync();
}

logLine(text, color) { this.sim.log.push({ text: text, color: color }); }
who(a) { return a ? 'Agent ' + this.CREW[a.id].name.charAt(0) + this.CREW[a.id].name.slice(1).toLowerCase() : ''; }

burst(x, y, n, cols, spread, up, floor) {
  for (let i = 0; i < n; i++) this.sim.parts.push({ x: x, y: y, vx: (Math.random() - 0.5) * spread, vy: -up * (0.4 + Math.random() * 0.8), g: 160, life: 0.9 + Math.random() * 0.9, c: cols[i % cols.length], s: Math.random() < 0.3 ? 2 : 1, floor: floor || 400 });
}

fire(ev, a) {
  const S = this.sim, kv = ev.split(':'), k = kv[0], v = kv[1], I = this.ISSUES[v];
  if (k === 'pin') {
    const i = S.issueOrder.length; S.issueOrder.push(v); S.issues[v] = 'open'; S.cardT[v] = S.t; S.alarmAt = S.t; S.shake = 0.5;
    S.beams.push({ x0: 360, y0: 94, x1: 181, y1: 70 + i * 31, c: '255,77,94', t0: S.t });
    this.logLine('! ' + this.who(a) + ' pinned ' + I.id + ': ' + I.title, '#FF7A84');
  }
  if (k === 'take') S.issues[v] = 'repair';
  if (k === 'fix') this.logLine('> ' + this.who(a) + ' took ' + I.id + ' to the repair bay', '#FFD27A');
  if (k === 'pr') {
    const i = S.prOrder.length; S.issues[v] = 'fixed'; S.prOrder.push(v); S.prs[v] = 'tests'; S.prT[v] = S.t;
    S.beams.push({ x0: 360, y0: 94, x1: 539, y1: 70 + i * 31, c: '92,225,230', t0: S.t });
    this.burst(this.X(a.u, a.y), a.y - 40, 14, ['#5CE1E6', '#FFFFFF'], 60, 70, a.y);
    this.logLine('> ' + I.pr + ' pinned to the cleared board, tests passing', '#5CE1E6');
  }
  if (k === 'pass') this.logLine('> ' + this.who(a) + ': ' + this.CHECKS[v], '#BFA58F');
  if (k === 'ready') {
    Object.keys(S.prs).forEach((p) => { S.prs[p] = 'ready'; }); S.readyAt = S.t;
    this.burst(539, 90, 70, ['#FFD27A', '#FF9B3D', '#FF4D5E', '#5CE1E6', '#FFFFFF'], 160, 120, 216);
    this.logLine('> ' + this.who(a) + ': pull requests approved for your review', '#FFD27A');
  }
  if (k === 'done') { S.doneAt = S.t; this.logLine('> Scan complete. Agents returning to stations.', '#F7EBDD'); }
  this.sync();
}

sync() {
  const S = this.sim, ready = S.prOrder.filter((k) => S.prs[k] === 'ready').length;
  const line = S.mode === 'offline' ? 'OFFLINE / ALL AGENTS ASLEEP' : S.doneAt !== null ? 'SCAN COMPLETE / ' + ready + ' PULL REQUESTS READY FOR REVIEW' : 'SCAN IN PROGRESS / ' + S.issueOrder.length + ' ISSUES / ' + S.prOrder.length + ' FIXES';
  this.setState({ log: S.log.slice(-3), line: line });
}

route(fromKey, toKey) {
  const F = this.LOC[fromKey], T = this.LOC[toKey];
  const fl = F && F.via.length ? F.via[F.via.length - 1] : null, tl = T.via.length ? T.via[T.via.length - 1] : null;
  const sameAisle = fl && tl && Math.abs(fl[1] - tl[1]) < 1e-6;
  let pts = (F ? F.via : []).concat(sameAisle ? [] : [this.HUB], T.via.slice().reverse(), [T.p]);
  const eq = (p, q) => Math.abs(p[0] - q[0]) < 1e-6 && Math.abs(p[1] - q[1]) < 1e-6;
  let changed = true;
  while (changed) {
    changed = false;
    for (let i = 1; i < pts.length; i++) if (eq(pts[i], pts[i - 1])) { pts.splice(i, 1); changed = true; break; }
    for (let i = 1; i < pts.length - 1 && !changed; i++) if (eq(pts[i - 1], pts[i + 1])) { pts.splice(i, 2); changed = true; }
  }
  return pts.map((p) => p.slice());
}

step(dt) {
  const S = this.sim; S.t += dt; S.shake = Math.max(0, S.shake - dt);
  if (S.doneAt !== null && S.t - S.doneAt > 8) { this.reset(S.mode); return; }
  S.agents.forEach((a) => {
    if (!a.cur) { a.cur = a.q.shift() || null; if (a.cur) a.cur.el = 0; }
    const c = a.cur;
    if (c) {
      if (c.type === 'go') {
        if (!c.pts) { c.pts = this.route(a.loc, c.to); a.seated = false; }
        a.walking = true; a.say = ''; a.at = null; a.fx = null;
        const tp = c.pts[0], sx = this.X(a.u, a.y), tx = this.X(tp[0], tp[1]), dx = tx - sx, dy = tp[1] - a.y, d = Math.sqrt(dx * dx + dy * dy);
        const sp = (c.run ? 70 : 46) * this.sc(a.y) * dt;
        if (d > 0.01) a.face = Math.abs(dy) > Math.abs(dx) * 0.6 ? (dy > 0 ? 'front' : 'back') : (dx > 0 ? 'right' : 'left');
        if (d <= sp) {
          a.u = tp[0]; a.y = tp[1]; c.pts.shift();
          if (!c.pts.length) {
            a.cur = null; a.walking = false; a.loc = c.to; const L = this.LOC[c.to]; a.face = L.face; a.seated = !!L.sit;
            this.burst(this.X(a.u, a.y), a.y - 1, 4, ['#4A3A30', '#3A2A20'], 30, 18, a.y);
          }
        } else { const nx = sx + (dx / d) * sp, ny = a.y + (dy / d) * sp; a.y = ny; a.u = (nx - 360) / this.hw(ny); }
      } else if (c.type === 'work' || c.type === 'until') {
        a.walking = false; a.anim = c.anim || 'type'; a.say = c.say || ''; a.at = c.at || null; a.fx = c.fx || null; c.el += dt;
        if (c.type === 'work' ? c.el >= c.secs : S.prOrder.length >= c.n) { a.cur = null; a.say = ''; a.at = null; a.fx = null; }
      } else if (c.type === 'emote') {
        if (c.el === 0) a.emote = { e: c.e, from: S.t, until: S.t + c.secs };
        a.walking = false; a.anim = 'idle'; a.say = ''; c.el += dt; if (c.el >= c.secs) a.cur = null;
      } else if (c.type === 'carry') { a.carry = c.c; a.cur = null; }
      else if (c.type === 'ev') { a.cur = null; this.fire(c.ev, a); }
    }
    if (a.say !== a.prevSay) { a.prevSay = a.say; a.sayAt = S.t; }
    if (a.fx === 'spark' && Math.floor(S.t * 8) % 4 === 2 && Math.random() < 0.7) {
      const s = this.sc(a.y), x = this.X(a.u, a.y) + 9 * s, y = a.y - 13 * s;
      for (let n = 0; n < 3; n++) S.parts.push({ x: x, y: y, vx: (Math.random() - 0.3) * 70, vy: -20 - Math.random() * 50, g: 220, life: 0.3 + Math.random() * 0.3, c: n ? '#FFD27A' : '#FFFFFF', s: 1, floor: a.y });
    }
  });
  S.parts = S.parts.filter((p) => (p.life -= dt) > 0).slice(-320);
  S.parts.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; if (p.y > p.floor) { p.y = p.floor; p.vy *= -0.3; p.vx *= 0.6; } });
  S.beams = S.beams.filter((b) => S.t - b.t0 < 1.2);
}

fig(g, id, x, y, s, view, pose, T, o) {
  o = o || {};
  const A = this.CREW[id], SUIT = '#1C1E27', SUITD = '#111218', SUITL = '#2E3140', PANTS = '#15161D', SHOE = '#07070B', SHIRT = '#ECECF2', GL = '#06060B';
  const side = view === 'left' || view === 'right';
  const R = (ux, uy, uw, uh, c) => {
    g.fillStyle = c; const X0 = view === 'left' ? x - (ux + uw) * s : x + ux * s;
    const px = Math.round(X0), py = Math.round(y + uy * s);

poseOf(a) {
  const S = this.sim, poked = S.t - a.poke < 1.4;
  if (a.walking) return ['walk', a.face];
  if (a.seated) {
    if (a.anim === 'sleep' && !poked) return [a.front ? 'sleepFront' : 'sleepSit', a.front ? 'front' : 'back'];
    if (a.anim === 'sleep' && poked) return [a.front ? 'sitFront' : 'sit', a.front ? 'front' : 'back'];
    if (a.anim === 'stretch') return ['sitStretch', 'back'];
    if (a.anim === 'cheer') return ['cheer', 'front'];
    return ['sit', 'back'];
  }
  if (a.anim === 'cheer') return ['cheer', 'front'];
  if (a.anim === 'hammer') return ['hammer', 'right'];
  if (a.anim === 'scan') return ['scan', 'left'];
  if (a.anim === 'pin') return ['pin', 'back'];
  if (a.anim === 'stretch') return ['stretch', 'front'];
  return ['idle', a.face];
}

drawAgent(g, a, T) {
  const S = this.sim, s = this.sc(a.y), x = this.X(a.u, a.y), pv = this.poseOf(a);
  this.fig(g, a.id, Math.round(x), Math.round(a.y), s, pv[1], pv[0], T, { off: a.off, carry: a.carry });
  const seated = /^sit|^sleep/.test(pv[0]), top = a.y + (seated ? -24 : -33) * s;
  const poked = S.t - a.poke < 1.4;
  this.post.push((gg) => {
    if (pv[0] === 'sleepSit' || pv[0] === 'sleepFront') {
      for (let i = 0; i < 3; i++) {
        const ph = ((T * 0.45) + i / 3 + a.off) % 1, zx = x + 5 * s + ph * 10 * s, zy = top - ph * 16, al = (1 - ph).toFixed(2), z = Math.max(3, Math.round(2.4 * s));
        gg.fillStyle = 'rgba(159,190,232,' + al + ')';
        gg.fillRect(Math.round(zx), Math.round(zy), z, 1); gg.fillRect(Math.round(zx + z - 2), Math.round(zy + 1), 1, 1); gg.fillRect(Math.round(zx + 1), Math.round(zy + 2), 1, 1); gg.fillRect(Math.round(zx), Math.round(zy + 3), z, 1);
      }
    }
    if (pv[0] === 'hammer' && Math.floor(T * 3) % 2) { gg.fillStyle = '#9FE8F0'; gg.fillRect(Math.round(x - 4 * s), Math.round(top + 2 * s), 1, 2); }
    const em = a.emote && S.t < a.emote.until ? a.emote.e : poked ? '?' : null;
    if (em) {
      const ex = Math.round(x), ey = Math.round(top - 6 - (a.emote && S.t - a.emote.from < 0.12 ? 2 : 0)), P = (dx, dy, w, h, c) => { gg.fillStyle = c; gg.fillRect(ex + dx, ey + dy, w, h); };
      P(-5, -11, 11, 11, '#FFFFFF'); P(-1, 0, 3, 2, '#FFFFFF'); P(-5, -11, 11, 1, '#E8E2D6');
      if (em === '!') { P(0, -9, 1, 5, '#FF4D5E'); P(0, -3, 1, 1, '#FF4D5E'); }
      if (em === '?') { P(-1, -9, 3, 1, '#2B3A66'); P(1, -8, 1, 2, '#2B3A66'); P(0, -6, 1, 1, '#2B3A66'); P(0, -3, 1, 1, '#2B3A66'); }
      if (em === 'ok') { P(-2, -6, 5, 1, '#E8A51A'); P(0, -8, 1, 5, '#E8A51A'); P(2, -10, 1, 1, '#E8A51A'); }
      if (em === 'heart') { P(-3, -9, 2, 1, '#FF5F8F'); P(1, -9, 2, 1, '#FF5F8F'); P(-4, -8, 8, 2, '#FF5F8F'); P(-3, -6, 6, 1, '#FF5F8F'); P(-2, -5, 4, 1, '#FF5F8F'); P(-1, -4, 2, 1, '#FF5F8F'); }
    }
  });
}

drawTexts(ctx, k, T, ox, oy) {
  this.texts.forEach((t) => {
    ctx.save();
    if (t.clip) { ctx.beginPath(); ctx.rect(t.clip[0] * k + ox, t.clip[1] * k + oy, t.clip[2] * k, t.clip[3] * k); ctx.clip(); }

    if (t.box) { const w = ctx.measureText(t.t).width + 10; ctx.strokeStyle = t.color; ctx.lineWidth = 2; ctx.strokeRect(-w / 2, -fs, w, fs + 6); }
    if (t.glow) { ctx.shadowColor = t.color; ctx.shadowBlur = 10; }
    ctx.fillStyle = t.color; ctx.fillText(t.t, 0, 0); ctx.restore();
  });
  const S = this.sim, fs = Math.round(13 * k / 2);
  ctx.font = fs + 'px Silkscreen, monospace'; ctx.textAlign = 'center';
  S.agents.forEach((a) => {
    if (!a.say) return;
    const s = this.sc(a.y), seated = a.seated, sx = this.X(a.u, a.y) * k + ox, sy = (a.y + (seated ? -27 : -37) * s) * k + oy - 22;
    const txt = /ING$/.test(a.say) ? a.say + '.'.repeat(1 + (Math.floor(T * 2.5) % 3)) : a.say;
    const w = Math.ceil(ctx.measureText(a.say + '...').width) + 22, pk = Math.min(1, (S.t - a.sayAt) / 0.15), scl = 0.7 + 0.3 * pk + (pk < 1 ? 0.08 : 0);
    const hot = /PINNING/.test(a.say), ok = /APPROVAL|COMPLETE/.test(a.say), W = 720 * k;
    ctx.save(); ctx.translate(Math.max(w / 2 + 6, Math.min(W - w / 2 - 6, sx)), sy); ctx.scale(scl, scl);
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(-w / 2 + 3, -fs - 4, w, fs + 14);
    ctx.fillStyle = hot ? '#FF4D5E' : ok ? '#FFD27A' : '#F7EBDD'; ctx.fillRect(-w / 2, -fs - 7, w, fs + 14);
    ctx.beginPath(); ctx.moveTo(-6, 7); ctx.lineTo(6, 7); ctx.lineTo(0, 14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = hot ? '#FFFFFF' : '#1A0E06'; ctx.fillText(txt, 0, 1); ctx.restore();
  });
  const hv = S.agents.find((a) => a.id === this.hover);

    const C = this.CREW[hv.id], s = this.sc(hv.y), ax = this.X(hv.u, hv.y) * k + ox, ay = hv.y * k + oy;
    const bw = 320, bh = 150, bx = Math.max(8, Math.min(720 * k - bw - 8, ax + 30)), by = Math.max(70, Math.min(405 * k - bh - 70, ay - bh - 20 * s));
    ctx.fillStyle = 'rgba(8,5,3,0.94)'; ctx.fillRect(bx, by, bw, bh); ctx.strokeStyle = C.tie; ctx.lineWidth = 2; ctx.strokeRect(bx + 1, by + 1, bw - 2, bh - 2);
    ctx.fillStyle = '#1A120C'; ctx.fillRect(bx + 10, by + 10, 96, bh - 20);
    ctx.fillStyle = 'rgba(255,155,61,0.12)'; for (let i = 0; i < 6; i++) ctx.fillRect(bx + 10, by + 14 + i * 22, 96, 1);
    this.fig(ctx, hv.id, bx + 58, by + bh - 14, 3.6, 'front', 'idle', T, { off: hv.off });
    const st = hv.anim === 'sleep' ? 'ASLEEP AT STATION' : hv.say ? hv.say : hv.walking ? 'ON THE MOVE' : 'STANDING BY';
    ctx.textAlign = 'left'; ctx.font = '16px Silkscreen, monospace'; ctx.fillStyle = C.tie; ctx.fillText(C.name, bx + 120, by + 32);
    ctx.font = '12px Silkscreen, monospace'; ctx.fillStyle = '#F7EBDD'; ctx.fillText(C.role, bx + 120, by + 54);
    ctx.fillStyle = '#BFA58F'; ctx.fillText(C.code + ' / CLEARANCE OMEGA', bx + 120, by + 74);
    ctx.fillStyle = '#FFD27A'; ctx.fillText(st, bx + 120, by + 100);
    ctx.strokeStyle = '#FF4D5E'; ctx.lineWidth = 2; ctx.save(); ctx.translate(bx + 250, by + 128); ctx.rotate(-0.15); ctx.strokeRect(-48, -14, 96, 22); ctx.fillStyle = '#FF4D5E'; ctx.textAlign = 'center'; ctx.fillText('TOP SECRET', 0, 2); ctx.restore();
  }
}

draw(T) {
  const S = this.sim, g = this.buf.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.imageSmoothingEnabled = false; g.globalCompositeOperation = 'source-over';
  this.texts = []; this.post = []; this.glows = [];
  const offline = S.mode === 'offline', alarm = Object.keys(S.issues).some((k) => S.issues[k] === 'open' || S.issues[k] === 'repair');
  const act = {}; S.agents.forEach((a) => { if (a.at) act[a.at] = true; });
  g.fillStyle = '#050302'; g.fillRect(0, 0, 720, 405);
  this.drawRoom(g, T, offline, alarm, act);
  const list = [];
  this.DESKS.forEach((d) => list.push({ k: d.yF, d: () => this.drawDesk(g, d, act, offline, T) }));
  this.CHAIRS.forEach((c) => {
    const occ = S.agents.find((a) => a.loc === c[0] && a.seated && a.front && !a.walking);
    if (occ) return;
    list.push({ k: c[2] + 0.6, d: () => { const busy = S.agents.find((a) => a.loc === c[0] && a.seated && !a.walking); this.chair(g, this.X(c[1], c[2]), c[2] + (busy ? 0 : 0), this.sc(c[2]), c[0] === 'seat_lead'); } });
  });
  S.agents.forEach((a) => list.push({ k: a.y + (a.seated ? 0 : 0.3), d: () => this.drawAgent(g, a, T) }));
  list.push({ k: 262.5, d: () => this.drawBench(g, T, offline, act) });
  list.push({ k: 252.5, d: () => this.drawTest(g, T, offline, act) });
  list.sort((p, q) => p.k - q.k).forEach((o) => o.d());
  this.rect(g, 0, 393, 720, 12, '#0A0605'); this.rect(g, 0, 393, 720, 1, offline ? '#3A2414' : '#FF9B3D');
  for (let i = 0; i < 18; i++) this.rect(g, 18 + i * 40, 398, 3, 2, Math.floor(T * 3 + i) % 6 === 0 ? '#FFD27A' : '#3A2414');
  g.globalCompositeOperation = 'lighter';
  S.beams.forEach((b) => {
    const p = (S.t - b.t0) / 1.2, al = (1 - p) * 0.8;
    g.strokeStyle = 'rgba(' + b.c + ',' + al.toFixed(3) + ')'; g.lineWidth = 2; g.beginPath(); g.moveTo(b.x0, b.y0); g.lineTo(b.x1, b.y1); g.stroke();
    const q = Math.min(1, p * 2.5); g.fillStyle = 'rgba(255,255,255,' + al.toFixed(3) + ')'; g.fillRect(Math.round(b.x0 + (b.x1 - b.x0) * q) - 1, Math.round(b.y0 + (b.y1 - b.y0) * q) - 1, 3, 3);
  });
  if (act.holo) { g.strokeStyle = 'rgba(255,190,90,' + (0.25 + 0.15 * Math.sin(T * 6)).toFixed(3) + ')'; g.lineWidth = 1; g.beginPath(); g.moveTo(360, 330); g.lineTo(360, 140); g.stroke(); }
  if (alarm) {
    [120, 242].forEach((bx, i) => {
      const an = T * 4.2 + i * Math.PI;
      g.fillStyle = 'rgba(255,50,60,0.10)'; g.beginPath(); g.moveTo(bx, 32); g.lineTo(bx + Math.cos(an - 0.2) * 700, 32 + Math.abs(Math.sin(an - 0.2)) * 520); g.lineTo(bx + Math.cos(an + 0.2) * 700, 32 + Math.abs(Math.sin(an + 0.2)) * 520); g.closePath(); g.fill();
    });
  }
  g.globalCompositeOperation = 'source-over';
  S.parts.forEach((p) => { g.fillStyle = p.c; g.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); });
  if (offline) { g.fillStyle = 'rgba(4,8,24,0.58)'; g.fillRect(0, 0, 720, 405); }
  if (alarm) { const since = S.t - S.alarmAt, fl = since < 1.4 ? 0.2 * (1 - since / 1.4) : 0; g.fillStyle = 'rgba(255,30,40,' + (0.04 + 0.04 * (0.5 + 0.5 * Math.sin(T * 6)) + fl).toFixed(3) + ')'; g.fillRect(0, 0, 720, 405); }
  if (S.t - S.readyAt < 0.5) { g.fillStyle = 'rgba(255,210,122,' + (0.25 * (1 - (S.t - S.readyAt) / 0.5)).toFixed(3) + ')'; g.fillRect(0, 0, 720, 405); }
  g.globalCompositeOperation = 'lighter';
  this.glows.forEach((gl) => { const rg = g.createRadialGradient(gl[0], gl[1], 0, gl[0], gl[1], gl[2]); rg.addColorStop(0, 'rgba(' + gl[4] + ',' + gl[3] + ')'); rg.addColorStop(1, 'rgba(' + gl[4] + ',0)'); g.fillStyle = rg; g.fillRect(gl[0] - gl[2], gl[1] - gl[2], gl[2] * 2, gl[2] * 2); });
  g.globalCompositeOperation = 'source-over';
  this.post.forEach((fn) => fn(g));
  const vg = g.createRadialGradient(360, 200, 180, 360, 200, 470); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)'); g.fillStyle = vg; g.fillRect(0, 0, 720, 405);
  const c = this.view, cw = c.clientWidth || 1440, ch = Math.round(cw * 9 / 16), dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (c.width !== Math.round(cw * dpr) || c.height !== Math.round(ch * dpr)) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.imageSmoothingEnabled = false;
  const k = cw / 720, sh = S.shake > 0 ? 3 + S.shake * 8 : 0, ox = sh ? Math.round((Math.random() - 0.5) * sh) : 0, oy = sh ? Math.round((Math.random() - 0.5) * sh) : 0;
  ctx.fillStyle = '#050302'; ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(this.buf, 0, 0, 720, 405, ox, oy, cw, ch);
  this.drawTexts(ctx, k, T, ox, oy);
  ctx.fillStyle = 'rgba(0,0,0,0.07)'; for (let yy = 0; yy < ch; yy += 3) ctx.fillRect(0, yy, cw, 1);
}

frame = (now) => {
  this.raf = requestAnimationFrame(this.frame);
  const dt = Math.min(0.05, (now - (this.prev || now)) / 1000); this.prev = now;
  if (!this.sim || !this.view) return;
  this.step(this.still ? 0 : dt);
  this.draw(this.still ? 0 : now / 1000);
};

hit(e) {
  const r = this.view.getBoundingClientRect(), bx = (e.clientX - r.left) * (720 / r.width), by = (e.clientY - r.top) * (405 / r.height);
  let best = null, bd = 1e9;
  this.sim.agents.forEach((a) => {
    const s = this.sc(a.y), x = this.X(a.u, a.y), d = Math.abs(bx - x), top = a.y - (a.seated ? 24 : 33) * s;
    if (d < 8 * s && by > top && by < a.y + 2 && d < bd) { bd = d; best = a; }
  });
  return best;
}
onCanvasMove = (e) => { if (!this.sim || !this.view) return; const a = this.hit(e); this.hover = a ? a.id : null; };
onCanvasLeave = () => { this.hover = null; };
onCanvasClick = (e) => {
  if (!this.sim || !this.view) return;
  const a = this.hit(e); if (!a) return;
  if (a.anim === 'sleep') a.poke = this.sim.t; else a.emote = { e: 'heart', from: this.sim.t, until: this.sim.t + 1.2 };
};

componentDidMount() {
  this.still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  this.buf = document.createElement('canvas'); this.buf.width = 720; this.buf.height = 405;
  this.texts = []; this.post = []; this.glows = [];
  this.reset(this.mode());
  this.raf = requestAnimationFrame(this.frame);
}
componentDidUpdate() { if (this.sim && this.sim.mode !== this.mode()) this.reset(this.mode()); }
componentWillUnmount() { cancelAnimationFrame(this.raf); }

renderVals() {
  const mode = this.mode();
  return {
    setView: this.setView, onCanvasMove: this.onCanvasMove, onCanvasLeave: this.onCanvasLeave, onCanvasClick: this.onCanvasClick,
    modes: [['offline', 'Offline'], ['quick', 'After project'], ['deep', 'Biweekly deep scan']].map((m) => ({ label: m[1], on: mode === m[0], cls: mode === m[0] ? 'on' : '', pick: () => this.setState({ mode: m[0] }) })),
    status: this.state.line, statusColor: mode === 'offline' ? '#8FA2C4' : /COMPLETE/.test(this.state.line) ? '#5CE1E6' : '#FFB45E',
    log: this.state.log
  };
}
}
