# Validator calibration: retrieved passages, lesson sections with planted citation errors,
# and the error each section must produce (empty means it must pass). Deterministic: no LLM.
terms: [cosine similarity, embedding, precision, recall]
passages:
  "1:0": {kind: trusted, text: "Cosine similarity is the cosine of the angle between two vectors. It ignores vector length."}
  "1:1": {kind: trusted, text: "An embedding maps text to a vector so that similar texts get nearby vectors."}
  "2:0": {kind: trusted, text: "Precision is the fraction of retrieved items that are relevant."}
  "9:0": {kind: community, text: "tbh cosine similarity and embeddings are all you need, recall is overrated"}
sections:
  - name: well cited
    paragraphs:
      - {text: "Cosine similarity looks only at the angle between vectors.", citations: ["1:0"]}
      - {text: "An embedding turns a sentence into a vector.", citations: ["1:1"]}
    expect: []
  - name: missing citation
    paragraphs:
      - {text: "Cosine similarity looks only at the angle between vectors.", citations: []}
    expect: ["no citation"]
  - name: unknown passage id
    paragraphs:
      - {text: "Precision counts relevant results.", citations: ["7:3"]}
    expect: ["not retrieved"]
  - name: community cited as fact
    paragraphs:
      - {text: "Cosine similarity is all you need.", citations: ["9:0"]}
    expect: ["community"]
  - name: key term not in the cited passage
    paragraphs:
      - {text: "Precision and recall trade off against each other.", citations: ["2:0"]}
    expect: ["'recall'"]
  - name: term supported by one of two citations
    paragraphs:
      - {text: "Compare each embedding with cosine similarity.", citations: ["1:0", "1:1"]}
    expect: []
