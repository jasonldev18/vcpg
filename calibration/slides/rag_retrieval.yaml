gate: |
  Interviewer: Why split the notes into chunks at all?
  Learner: One vector for a whole lecture blurs its topics, so a specific question matches it weakly.  [1 of 3 points covered]
  Interviewer: How did you pick the chunk size?
  Learner: Smaller chunks lose context and bigger ones dilute the match, 300 words seemed a middle ground.  [2 of 3 points covered]
  Interviewer: How would you know retrieval failed?
