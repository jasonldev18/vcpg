step: |
  Title: Chunking and retrieval
  Component: llm
  Goal: Answer questions about lecture notes by retrieving the most relevant passages.
  Concepts: chunking, embeddings, similarity search
build_summary: |
  ingest.py: splits notes into about 300-word chunks at paragraph boundaries with 50 words of overlap
  retrieve.py: embeds the question and returns the top 4 chunks by cosine similarity
  Decision: overlap so a sentence split across chunks is still found
