step: |
  Title: KNN recommender core
  Component: backend
  Goal: Recommend five films for a user from their nearest neighbours.
  Concepts: mean-centring, cosine similarity, k-nearest neighbours, cold start
build_summary: |
  recommend.py: mean-centres ratings, cosine similarity over co-rated films, keeps k=20 neighbours
  test_recommend.py: tests a user with known neighbours gets their films
  Decision: k=20 because the tutorial dataset has 610 users
  Reviewer cut from recommend.py: a None check on the ratings dict (the loader never returns None)
build_note: '{"files": [{"path": "recommend.py", "summary": "KNN recommender"}], "decisions": ["k=20"], "not_done": ["no evaluation yet"]}'
