gate: |
  Interviewer: Why subtract each user's mean before comparing?
  Learner: Because some people rate everything high, and I want to compare what they like more than usual, not their scale.  [1 of 4 points covered]
  Interviewer: Why cosine and not Euclidean distance?
  Learner: I'm not sure, it was the default.  [1 of 4 points covered]
  Interviewer: Hint: think about users who rated very different numbers of films.
  Learner: Euclidean would push apart people who rated lots of films even if their tastes match; cosine only looks at direction.  [2 of 4 points covered]
  Interviewer: What happens with k?
  Learner: Small k is noisy, big k drifts to popular films.  [3 of 4 points covered]
  Interviewer: And a brand-new user?
  Learner: No ratings means no neighbours, so we fall back to popular films.  [4 of 4 points covered]
  [hints given in total: 1]
forbidden: [GPU, Redis, Spark, "%", million, milliseconds]
