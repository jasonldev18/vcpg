# Reviewer calibration: markers are unique strings inside planted code. After review,
# every `unreachable` marker must be gone and every `boundary` marker must remain.
step:
  title: Sentiment label parser
  goal: Turn the model's JSON replies into labels and count them.
  files: [labels.py, test_labels.py]
  acceptance:
    - 'parse_label returns the label from a reply like {"label": "positive"}'
    - A reply that is not valid JSON or has an unknown label raises ValueError
    - run returns counts for positive, negative and neutral
build_note: >
  {"files": [{"path": "labels.py", "summary": "parse model replies and count labels"},
  {"path": "test_labels.py", "summary": "tests for parsing and counting"}],
  "decisions": ["treat the model reply as untrusted text"], "not_done": []}
unreachable:
  - {file: labels.py, marker: CAL-unreachable-duplicate}
  - {file: labels.py, marker: CAL-unreachable-after-return}
  - {file: labels.py, marker: CAL-unreachable-unused-function}
boundary:
  - {file: labels.py, marker: CAL-boundary-json}
  - {file: labels.py, marker: CAL-boundary-label}
